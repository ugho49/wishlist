name: Setup Bun
description: Setup Bun and restore cached dependencies

outputs:
  cache-hit:
    description: Whether the cache was hit
    value: ${{ steps.cache-deps.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version: lts/*

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: ".bun-version"

    - name: Restore cached dependencies
      id: cache-deps
      uses: actions/cache@v5
      with:
        path: |
          node_modules
          apps/*/node_modules
          libs/*/node_modules
          plugin/*/node_modules
          ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', '**/package.json') }}
        restore-keys: |
          ${{ runner.os }}-bun-

    - name: Install dependencies
      if: steps.cache-deps.outputs.cache-hit != 'true'
      shell: bash
      run: bun install --frozen-lockfile
