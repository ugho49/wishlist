name: Deploy API

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: write

jobs:
  run-drizzle-migrations:
      name: Run Drizzle Migrations
      runs-on: ubuntu-latest
      environment: production
      timeout-minutes: 5
      env:
        DB_HOST: ${{ secrets.DB_HOST }}
        DB_PORT: ${{ secrets.DB_PORT }}
        DB_USERNAME: ${{ secrets.DB_USERNAME }}
        DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        DB_NAME: ${{ secrets.DB_NAME }}
      steps:
        - name: Checkout
          uses: actions/checkout@v6

        - name: Setup
          uses: ./.github/actions/setup

        - name: Connect to Tailscale
          uses: tailscale/github-action@v4
          with:
            oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
            oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
            tags: tag:wishlist-ci

        - name: Run migrations
          run: |
            echo "Running Drizzle migrations..."
            bun db:migrate

  deploy-to-vps:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    environment: production
    needs: run-drizzle-migrations
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Deploy to VPS
        uses: ./.github/actions/deploy-to-vps
        with:
          application-id: ${{ secrets.DOKPLOY_API_APPLICATION_ID }}
          version: ${{ inputs.version }}
          docker-image: ughoste/wishlist-api
          vps-api-url: ${{ secrets.VPS_API_URL }}
          vps-api-key: ${{ secrets.VPS_API_KEY }}

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: deploy-to-vps
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="api@${{ inputs.version }}"
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          gh release create "$TAG" \
            --title "API ${{ inputs.version }}" \
            --notes "Release API version ${{ inputs.version }} (commit: ${SHORT_SHA})" \
            --target "$GITHUB_SHA"
