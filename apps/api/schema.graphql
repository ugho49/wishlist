"""
What any other user may know about a user: never add private data here, it is sent to every
attendee, wishlist owner or picker that shows this user. Put it on CurrentUser instead.
"""
type User {
  email: String!
  firstName: String!
  id: UserId!
  lastName: String!
  pictureUrl: String
}

type UserAccount {
  createdAt: String!
  email: String!
  id: UserAccountId!
  pictureUrl: String
  provider: UserAccountProvider!
  updatedAt: String!
}

scalar UserAccountId

enum UserAccountProvider {
  FACEBOOK
  GOOGLE
  PASSWORD
}

enum UserAuthorities {
  ROLE_ADMIN
  ROLE_SUPERADMIN
  ROLE_USER
}

type UserByEmailOutput {
  """
  The enabled account owning that exact email, other than the current user; null otherwise
  """
  user: User
}

union UserByEmailResult = BusinessRuleRejection | ForbiddenRejection | InternalErrorRejection | UnauthorizedRejection | UserByEmailOutput | ValidationRejection

type UserEmailSettings {
  birthdayReminder: Boolean!
  dailyNewItemNotification: Boolean!
}

type UserFull {
  accounts: [UserAccount!]! @resolved
  authorities: [UserAuthorities!]!
  birthday: String
  createdAt: String!
  email: String!
  firstName: String!
  id: UserId!
  isEnabled: Boolean!
  lastName: String!
  pictureUrl: String
  sessions: [UserSession!]! @resolved
  signupSource: SignupSource
  signupSourceDetail: String
  updatedAt: String!
}

scalar UserId

type UserSession {
  createdAt: String!
  current: Boolean! @resolved
  device: UserSessionDevice!
  expiresAt: String!
  id: UserSessionId!
  ip: String
  lastUsedAt: String!
}

type UserSessionDevice {
  browser: String!
  browserVersion: String
  label: String!
  model: String
  os: String!
  osVersion: String
  type: UserSessionDeviceType!
  vendor: String
}

enum UserSessionDeviceType {
  DESKTOP
  MOBILE
  TABLET
  UNKNOWN
}

scalar UserSessionId

type ValidationRejection {
  errors: [FieldError!]!
}

type VoidOutput {
  success: Boolean!
}

type Wishlist {
  coOwner: User @resolved
  coOwnerId: UserId
  createdAt: String!
  description: String
  eventIds: [EventId!]!
  events: [Event!]! @resolved
  id: WishlistId!
  items: [Item!]! @resolved
  logoUrl: String
  mode: WishlistMode!
  owner: User! @resolved
  ownerId: UserId!
  title: String!
  updatedAt: String!
}

scalar WishlistId

"""
What the managers (owner and co-owner) of a list see. The participants see the list and who reserved what in both modes.
"""
enum WishlistMode {
  """
  The managers see everything, like the participants. A list managed for someone else; allows a co-owner.
  """
  SHARED
  """
  The managers do not see who reserved what, nor the items suggested by the others. A list for oneself.
  """
  SURPRISE
}