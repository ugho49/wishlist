scalar EventId
scalar AttendeeId

enum AttendeeRole {
  CREATOR
  ADMIN
  PARTICIPANT
}

type EventAttendee {
  id: AttendeeId!
  user: User
  pendingEmail: String
  role: AttendeeRole!
}

type Event {
  id: EventId!
  title: String!
  description: String
  icon: String
  eventDate: String!
  wishlistIds: [WishlistId!]!
  wishlists: [Wishlist!]! @resolved
  attendees: [EventAttendee!]!
  secretSanta: SecretSanta @resolved
  createdAt: String!
  updatedAt: String!
}

type GetEventsPagedResponse {
  data: [Event!]!
  pagination: Pagination!
}

type AdminEventsStats {
  totalCount: Int!
  upcomingCount: Int!
  pastCount: Int!
  createdByMonth: [AdminMonthlyCount!]!
}

input EventPaginationFilters {
  page: Int
  limit: Int
  onlyFuture: Boolean
}

union GetEventByIdResult =
  | Event
  | UnauthorizedRejection
  | ForbiddenRejection
  | InternalErrorRejection
  | NotFoundRejection

union GetMyEventsResult = GetEventsPagedResponse | UnauthorizedRejection | ForbiddenRejection | InternalErrorRejection

########################################################
###############   Input Types   ########################
########################################################

input CreateEventAttendeeInput {
  email: String!
  role: AttendeeRole
}

input CreateEventInput {
  title: String!
  description: String
  icon: String
  eventDate: String!
  attendees: [CreateEventAttendeeInput!]
}

input UpdateEventInput {
  title: String!
  description: String
  icon: String
  eventDate: String!
}

input AddEventAttendeeInput {
  email: String!
  role: AttendeeRole
}

input AdminEventPaginationFilters {
  page: Int
  limit: Int
  userId: UserId
  criteria: String
}

########################################################
###############   Result Unions   ######################
########################################################

union CreateEventResult =
  | Event
  | ValidationRejection
  | UnauthorizedRejection
  | ForbiddenRejection
  | NotFoundRejection
  | InternalErrorRejection

union UpdateEventResult =
  | VoidOutput
  | ValidationRejection
  | UnauthorizedRejection
  | ForbiddenRejection
  | NotFoundRejection
  | InternalErrorRejection

union DeleteEventResult =
  | VoidOutput
  | ValidationRejection
  | UnauthorizedRejection
  | ForbiddenRejection
  | NotFoundRejection
  | InternalErrorRejection

union AddEventAttendeeResult =
  | EventAttendee
  | ValidationRejection
  | UnauthorizedRejection
  | ForbiddenRejection
  | NotFoundRejection
  | InternalErrorRejection

union RemoveEventAttendeeResult =
  | VoidOutput
  | ValidationRejection
  | UnauthorizedRejection
  | ForbiddenRejection
  | NotFoundRejection
  | InternalErrorRejection

union UpdateEventAttendeeRoleResult =
  | VoidOutput
  | ValidationRejection
  | UnauthorizedRejection
  | ForbiddenRejection
  | NotFoundRejection
  | InternalErrorRejection

union AdminGetEventByIdResult =
  | Event
  | ValidationRejection
  | UnauthorizedRejection
  | ForbiddenRejection
  | NotFoundRejection
  | InternalErrorRejection

union AdminGetEventsResult =
  | GetEventsPagedResponse
  | ValidationRejection
  | UnauthorizedRejection
  | ForbiddenRejection
  | InternalErrorRejection

union AdminEventsStatsResult = AdminEventsStats | UnauthorizedRejection | ForbiddenRejection | InternalErrorRejection

union AdminUpdateEventResult =
  | VoidOutput
  | ValidationRejection
  | UnauthorizedRejection
  | ForbiddenRejection
  | NotFoundRejection
  | InternalErrorRejection

union AdminDeleteEventResult =
  | VoidOutput
  | ValidationRejection
  | UnauthorizedRejection
  | ForbiddenRejection
  | NotFoundRejection
  | InternalErrorRejection

union AdminDeleteEventAttendeeResult =
  | VoidOutput
  | ValidationRejection
  | UnauthorizedRejection
  | ForbiddenRejection
  | NotFoundRejection
  | InternalErrorRejection

union AdminUpdateEventAttendeeRoleResult =
  | VoidOutput
  | ValidationRejection
  | UnauthorizedRejection
  | ForbiddenRejection
  | NotFoundRejection
  | InternalErrorRejection

extend type Query {
  event(id: EventId!): GetEventByIdResult
  events(filters: EventPaginationFilters!): GetMyEventsResult!
  adminEvent(id: EventId!): AdminGetEventByIdResult!
  adminEvents(filters: AdminEventPaginationFilters!): AdminGetEventsResult!
  adminEventsStats: AdminEventsStatsResult!
}

extend type Mutation {
  createEvent(input: CreateEventInput!): CreateEventResult!
  updateEvent(id: EventId!, input: UpdateEventInput!): UpdateEventResult!
  deleteEvent(id: EventId!): DeleteEventResult!
  addEventAttendee(eventId: EventId!, input: AddEventAttendeeInput!): AddEventAttendeeResult!
  removeEventAttendee(eventId: EventId!, attendeeId: AttendeeId!): RemoveEventAttendeeResult!
  updateEventAttendeeRole(
    eventId: EventId!
    attendeeId: AttendeeId!
    role: AttendeeRole!
  ): UpdateEventAttendeeRoleResult!
  adminUpdateEvent(id: EventId!, input: UpdateEventInput!): AdminUpdateEventResult!
  adminDeleteEvent(id: EventId!): AdminDeleteEventResult!
  adminDeleteEventAttendee(eventId: EventId!, attendeeId: AttendeeId!): AdminDeleteEventAttendeeResult!
  adminUpdateEventAttendeeRole(
    eventId: EventId!
    attendeeId: AttendeeId!
    role: AttendeeRole!
  ): AdminUpdateEventAttendeeRoleResult!
}
