scalar ItemId

type ItemTaker {
  userId: UserId!
  user: User! @resolved
  takenAt: String!
}

type Item {
  id: ItemId!
  name: String!
  description: String
  url: String
  score: Int
  isSuggested: Boolean
  pictureUrl: String
  takers: [ItemTaker!]!
  createdAt: String!
}

########################################################
###############   Input Types   ########################
########################################################

input CreateItemInput {
  wishlistId: WishlistId!
  name: String!
  description: String
  url: String
  score: Int
  pictureUrl: String
}

input UpdateItemInput {
  name: String!
  description: String
  url: String
  score: Int
  pictureUrl: String
}

input ScanItemUrlInput {
  url: String!
}

input ImportItemsInput {
  wishlistId: WishlistId!
  sourceItemIds: [ItemId!]!
}

input SetItemsPurchasedInput {
  itemIds: [ItemId!]!
  purchased: Boolean!
}

########################################################
###############   Output Types   #######################
########################################################

type ToggleItemOutput {
  takers: [ItemTaker!]!
}

type ScanItemUrlOutput {
  pictureUrl: String
}

type GetImportableItemsOutput {
  items: [Item!]!
}

type ImportItemsOutput {
  items: [Item!]!
}

type ItemPurchaseState {
  itemId: ItemId!
  purchasedAt: String
}

type SetItemsPurchasedOutput {
  items: [ItemPurchaseState!]!
}

########################################################
###############   Result Unions   ######################
########################################################

union CreateItemResult =
  | Item
  | ValidationRejection
  | UnauthorizedRejection
  | ForbiddenRejection
  | InternalErrorRejection

union UpdateItemResult =
  | VoidOutput
  | ValidationRejection
  | UnauthorizedRejection
  | ForbiddenRejection
  | InternalErrorRejection

union DeleteItemResult =
  | VoidOutput
  | ValidationRejection
  | UnauthorizedRejection
  | ForbiddenRejection
  | InternalErrorRejection

union ToggleItemResult =
  | ToggleItemOutput
  | ValidationRejection
  | UnauthorizedRejection
  | ForbiddenRejection
  | InternalErrorRejection

union ScanItemUrlResult =
  | ScanItemUrlOutput
  | ValidationRejection
  | UnauthorizedRejection
  | ForbiddenRejection
  | InternalErrorRejection

union GetImportableItemsResult =
  | GetImportableItemsOutput
  | UnauthorizedRejection
  | ForbiddenRejection
  | InternalErrorRejection

union ImportItemsResult =
  | ImportItemsOutput
  | ValidationRejection
  | UnauthorizedRejection
  | ForbiddenRejection
  | InternalErrorRejection

union SetItemsPurchasedResult =
  | SetItemsPurchasedOutput
  | ValidationRejection
  | UnauthorizedRejection
  | NotFoundRejection
  | InternalErrorRejection

########################################################
###############   Mutations   ##########################
########################################################

extend type Mutation {
  createItem(input: CreateItemInput!): CreateItemResult!
  updateItem(itemId: ItemId!, input: UpdateItemInput!): UpdateItemResult!
  deleteItem(itemId: ItemId!): DeleteItemResult!
  toggleItem(itemId: ItemId!): ToggleItemResult!
  scanItemUrl(input: ScanItemUrlInput!): ScanItemUrlResult!
  importItems(input: ImportItemsInput!): ImportItemsResult!
  "Marks or unmarks as bought gifts the current user reserved. All or nothing: one unknown or unreserved gift rejects the whole call."
  setItemsPurchased(input: SetItemsPurchasedInput!): SetItemsPurchasedResult!
}

########################################################
###############   Queries   ###########################
########################################################

type ReservedItemEvent {
  id: EventId!
  title: String!
  eventDate: String!
}

type ReservedItemTaker {
  userId: UserId!
  firstName: String!
  lastName: String!
  pictureUrl: String
  takenAt: String!
  purchasedAt: String
}

type ReservedItem {
  id: ItemId!
  name: String!
  description: String
  url: String
  score: Int
  pictureUrl: String
  takenAt: String!
  "When the current user marked the gift as bought."
  purchasedAt: String
  wishlistId: WishlistId!
  wishlistTitle: String!
  ownerFirstName: String!
  ownerLastName: String!
  events: [ReservedItemEvent!]!
  takers: [ReservedItemTaker!]!
}

enum ReservedItemPeriod {
  ALL
  RESERVED
  PAST
}

input MyReservedItemsFilters {
  page: Int
  limit: Int
  period: ReservedItemPeriod = RESERVED
}

type GetReservedItemsPagedResponse {
  data: [ReservedItem!]!
  pagination: Pagination!
  "Gifts of the period the current user already bought, across every page."
  purchasedCount: Int!
}

union GetMyReservedItemsResult =
  | GetReservedItemsPagedResponse
  | UnauthorizedRejection
  | ForbiddenRejection
  | InternalErrorRejection

########################################################
###############   Queries   ###########################
########################################################

extend type Query {
  importableItems(wishlistId: WishlistId!): GetImportableItemsResult!
  myReservedItems(filters: MyReservedItemsFilters!): GetMyReservedItemsResult!
}
