scalar ItemId

type ItemTaker {
  userId: UserId!
  user: User! @resolved
  takenAt: String!
}

type Item {
  id: ItemId!
  name: String!
  description: String
  url: String
  score: Int
  price: Float
  isSuggested: Boolean
  pictureUrl: String
  takers: [ItemTaker!]!
  createdAt: String!
}

########################################################
###############   Input Types   ########################
########################################################

input CreateItemInput {
  wishlistId: WishlistId!
  name: String!
  description: String
  url: String
  score: Int
  price: Float
  pictureUrl: String
}

input UpdateItemInput {
  name: String!
  description: String
  url: String
  score: Int
  price: Float
  pictureUrl: String
}

input ScanItemUrlInput {
  url: String!
}

input ImportItemsInput {
  wishlistId: WishlistId!
  sourceItemIds: [ItemId!]!
}

########################################################
###############   Output Types   #######################
########################################################

type ToggleItemOutput {
  takers: [ItemTaker!]!
}

type ScanItemUrlOutput {
  title: String
  description: String
  pictureUrl: String
  price: Float
  currency: String
  merchant: String
}

type GetImportableItemsOutput {
  items: [Item!]!
}

type ImportItemsOutput {
  items: [Item!]!
}

########################################################
###############   Result Unions   ######################
########################################################

union CreateItemResult =
  | Item
  | ValidationRejection
  | UnauthorizedRejection
  | ForbiddenRejection
  | InternalErrorRejection

union UpdateItemResult =
  | VoidOutput
  | ValidationRejection
  | UnauthorizedRejection
  | ForbiddenRejection
  | InternalErrorRejection

union DeleteItemResult =
  | VoidOutput
  | ValidationRejection
  | UnauthorizedRejection
  | ForbiddenRejection
  | InternalErrorRejection

union ToggleItemResult =
  | ToggleItemOutput
  | ValidationRejection
  | UnauthorizedRejection
  | ForbiddenRejection
  | InternalErrorRejection

union ScanItemUrlResult =
  | ScanItemUrlOutput
  | ValidationRejection
  | UnauthorizedRejection
  | ForbiddenRejection
  | InternalErrorRejection

union GetImportableItemsResult =
  | GetImportableItemsOutput
  | UnauthorizedRejection
  | ForbiddenRejection
  | InternalErrorRejection

union ImportItemsResult =
  | ImportItemsOutput
  | ValidationRejection
  | UnauthorizedRejection
  | ForbiddenRejection
  | InternalErrorRejection

########################################################
###############   Mutations   ##########################
########################################################

extend type Mutation {
  createItem(input: CreateItemInput!): CreateItemResult!
  updateItem(itemId: ItemId!, input: UpdateItemInput!): UpdateItemResult!
  deleteItem(itemId: ItemId!): DeleteItemResult!
  toggleItem(itemId: ItemId!): ToggleItemResult!
  scanItemUrl(input: ScanItemUrlInput!): ScanItemUrlResult!
  importItems(input: ImportItemsInput!): ImportItemsResult!
}

########################################################
###############   Queries   ###########################
########################################################

extend type Query {
  importableItems(wishlistId: WishlistId!): GetImportableItemsResult!
}
