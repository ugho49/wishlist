scalar UserAccountId
scalar UserId
scalar UserSessionId

enum UserAccountProvider {
  PASSWORD
  GOOGLE
  FACEBOOK
}

enum SignupSource {
  GOOGLE
  FRIENDS
  SOCIAL
  OTHER
}

type UserAccount {
  id: UserAccountId!
  email: String!
  provider: UserAccountProvider!
  pictureUrl: String
  createdAt: String!
  updatedAt: String!
}

enum UserSessionDeviceType {
  MOBILE
  TABLET
  DESKTOP
  UNKNOWN
}

type UserSessionDevice {
  browser: String!
  browserVersion: String
  os: String!
  osVersion: String
  type: UserSessionDeviceType!
  vendor: String
  model: String
  label: String!
}

type UserSession {
  id: UserSessionId!
  ip: String
  device: UserSessionDevice!
  createdAt: String!
  lastUsedAt: String!
  expiresAt: String!
  current: Boolean! @resolved
}

"""
What any other user may know about a user: never add private data here, it is sent to every
attendee, wishlist owner or picker that shows this user. Put it on CurrentUser instead.
"""
type User {
  id: UserId!
  firstName: String!
  lastName: String!
  email: String!
  pictureUrl: String
}

"""
The logged-in user, with their private data. Only returned to that user.
"""
type CurrentUser {
  id: UserId!
  firstName: String!
  lastName: String!
  email: String!
  pictureUrl: String
  birthday: String
  signupSource: SignupSource
  signupSourceDetail: String
  isEnabled: Boolean!
  createdAt: String!
  updatedAt: String!
  accounts: [UserAccount!] @resolved
  sessions: [UserSession!] @resolved
  emailSettings: UserEmailSettings @resolved
}

type PendingEmailChange {
  newEmail: String!
  expiredAt: String!
}

type UserEmailSettings {
  dailyNewItemNotification: Boolean!
  birthdayReminder: Boolean!
}

union GetCurrentUserResult = CurrentUser | UnauthorizedRejection | ForbiddenRejection | InternalErrorRejection

type SearchUsersOutput {
  users: [User!]!
}

type ClosestFriendsOutput {
  users: [User!]!
}

type UserByEmailOutput {
  """
  The enabled account owning that exact email, other than the current user; null otherwise
  """
  user: User
}

union SearchUsersResult =
  | SearchUsersOutput
  | ValidationRejection
  | UnauthorizedRejection
  | ForbiddenRejection
  | InternalErrorRejection

union ClosestFriendsResult =
  | ClosestFriendsOutput
  | ValidationRejection
  | UnauthorizedRejection
  | ForbiddenRejection
  | InternalErrorRejection

union UserByEmailResult =
  | UserByEmailOutput
  | ValidationRejection
  | BusinessRuleRejection
  | UnauthorizedRejection
  | ForbiddenRejection
  | InternalErrorRejection

union GetPendingEmailChangeResult =
  | PendingEmailChange
  | UnauthorizedRejection
  | ForbiddenRejection
  | InternalErrorRejection

input RegisterUserInput {
  firstname: String!
  lastname: String!
  email: String!
  password: String!
  birthday: String
}

input LinkUserToGoogleInput {
  code: String!
}

input UpdateUserProfileInput {
  firstname: String!
  lastname: String!
  birthday: String
}

input SetSignupSourceInput {
  source: SignupSource!
  detail: String
}

input ChangeUserPasswordInput {
  oldPassword: String!
  newPassword: String!
}

input UpdateUserPictureFromAccountInput {
  accountId: UserAccountId!
}

input RequestEmailChangeInput {
  newEmail: String!
}

input ConfirmEmailChangeInput {
  newEmail: String!
  token: String!
}

input UpdateUserEmailSettingsInput {
  dailyNewItemNotification: Boolean!
  birthdayReminder: Boolean!
}

input SendResetPasswordEmailInput {
  email: String!
}

input ResetPasswordInput {
  email: String!
  token: String!
  newPassword: String!
}

input RevokeSessionInput {
  sessionId: UserSessionId!
}

union RegisterUserResult =
  | CurrentUser
  | ValidationRejection
  | UnauthorizedRejection
  | ForbiddenRejection
  | BusinessRuleRejection
  | InternalErrorRejection

union LinkUserToGoogleResult =
  | UserAccount
  | ValidationRejection
  | UnauthorizedRejection
  | ForbiddenRejection
  | InternalErrorRejection

union UpdateUserProfileResult =
  | CurrentUser
  | ValidationRejection
  | UnauthorizedRejection
  | ForbiddenRejection
  | InternalErrorRejection

union SetSignupSourceResult =
  | CurrentUser
  | ValidationRejection
  | UnauthorizedRejection
  | ForbiddenRejection
  | InternalErrorRejection

union UnlinkCurrentUserAccountResult =
  | VoidOutput
  | ValidationRejection
  | UnauthorizedRejection
  | ForbiddenRejection
  | InternalErrorRejection

union ChangeUserPasswordResult =
  | VoidOutput
  | ValidationRejection
  | BusinessRuleRejection
  | UnauthorizedRejection
  | ForbiddenRejection
  | InternalErrorRejection

union UpdateUserPictureFromAccountResult =
  | VoidOutput
  | ValidationRejection
  | UnauthorizedRejection
  | ForbiddenRejection
  | InternalErrorRejection

union RemoveUserPictureResult =
  | VoidOutput
  | ValidationRejection
  | UnauthorizedRejection
  | ForbiddenRejection
  | InternalErrorRejection

union RequestEmailChangeResult =
  | VoidOutput
  | ValidationRejection
  | UnauthorizedRejection
  | ForbiddenRejection
  | InternalErrorRejection

union ConfirmEmailChangeResult =
  | VoidOutput
  | ValidationRejection
  | UnauthorizedRejection
  | ForbiddenRejection
  | InternalErrorRejection

union UpdateUserEmailSettingsResult =
  | UserEmailSettings
  | ValidationRejection
  | UnauthorizedRejection
  | ForbiddenRejection
  | InternalErrorRejection

union SendResetPasswordEmailResult =
  | VoidOutput
  | ValidationRejection
  | UnauthorizedRejection
  | ForbiddenRejection
  | BusinessRuleRejection
  | InternalErrorRejection

union ResetPasswordResult =
  | VoidOutput
  | ValidationRejection
  | UnauthorizedRejection
  | ForbiddenRejection
  | InternalErrorRejection

union RevokeSessionResult =
  | VoidOutput
  | ValidationRejection
  | UnauthorizedRejection
  | ForbiddenRejection
  | NotFoundRejection
  | InternalErrorRejection

extend type Query {
  currentUser: GetCurrentUserResult!
  pendingEmailChange: GetPendingEmailChangeResult
  """
  Users of the current user's circle (who attend an event with them) matching the keyword
  """
  searchUsers(keyword: String!): SearchUsersResult!
  """
  The account owning that exact email, rate limited (RATE_LIMITED business rule)
  """
  userByEmail(email: String!): UserByEmailResult!
  closestFriends(limit: Int): ClosestFriendsResult!
}

extend type Mutation {
  registerUser(input: RegisterUserInput!): RegisterUserResult!
  linkCurrentUserWithGoogle(input: LinkUserToGoogleInput!): LinkUserToGoogleResult!
  unlinkCurrentUserAccount(accountId: UserAccountId!): UnlinkCurrentUserAccountResult!
  updateUserProfile(input: UpdateUserProfileInput!): UpdateUserProfileResult!
  setSignupSource(input: SetSignupSourceInput!): SetSignupSourceResult!
  changeUserPassword(input: ChangeUserPasswordInput!): ChangeUserPasswordResult!
  updateUserPictureFromAccount(input: UpdateUserPictureFromAccountInput!): UpdateUserPictureFromAccountResult!
  removeUserPicture: RemoveUserPictureResult!
  requestEmailChange(input: RequestEmailChangeInput!): RequestEmailChangeResult!
  confirmEmailChange(input: ConfirmEmailChangeInput!): ConfirmEmailChangeResult!
  updateUserEmailSettings(input: UpdateUserEmailSettingsInput!): UpdateUserEmailSettingsResult!
  sendResetPasswordEmail(input: SendResetPasswordEmailInput!): SendResetPasswordEmailResult!
  resetPassword(input: ResetPasswordInput!): ResetPasswordResult!
  revokeSession(input: RevokeSessionInput!): RevokeSessionResult!
}
