enum UserAuthorities {
  ROLE_USER
  ROLE_ADMIN
  ROLE_SUPERADMIN
}

type UserFull {
  id: UserId!
  firstName: String!
  lastName: String!
  email: String!
  pictureUrl: String
  birthday: String
  signupSource: SignupSource
  signupSourceDetail: String
  isEnabled: Boolean!
  createdAt: String!
  updatedAt: String!
  accounts: [UserAccount!]! @resolved
  sessions: [UserSession!]! @resolved
  authorities: [UserAuthorities!]!
}

type AdminGetAllUsers {
  data: [UserFull!]!
  pagination: Pagination!
}

type AdminUsersStats {
  totalCount: Int!
  enabledCount: Int!
  adminCount: Int!
  createdByMonth: [AdminMonthlyCount!]!
}

type AdminUserMergeEvent {
  id: EventId!
  title: String!
  icon: String
  eventDate: String!
  role: AttendeeRole!
  inSecretSanta: Boolean!
}

type AdminUserMergeWishlist {
  id: WishlistId!
  title: String!
  logoUrl: String
  isCoOwner: Boolean!
  eventIds: [EventId!]!
  itemCount: Int!
}

type AdminUserMergeCandidate {
  user: UserFull!
  events: [AdminUserMergeEvent!]!
  wishlists: [AdminUserMergeWishlist!]!
  reservedItemCount: Int!
}

type AdminUserMergePreview {
  source: AdminUserMergeCandidate!
  target: AdminUserMergeCandidate!
}

enum AdminUserMergeSide {
  SOURCE
  TARGET
}

input AdminGetAllUsersPaginationFilters {
  page: Int
  limit: Int
  criteria: String
}

input AdminUpdateUserProfileInput {
  email: String
  newPassword: String
  firstname: String
  lastname: String
  birthday: String
  isEnabled: Boolean
}

input AdminMergeUsersProfileInput {
  email: AdminUserMergeSide!
  firstName: AdminUserMergeSide!
  lastName: AdminUserMergeSide!
  birthday: AdminUserMergeSide!
  picture: AdminUserMergeSide!
}

input AdminMergeUsersInput {
  sourceUserId: UserId!
  targetUserId: UserId!
  profile: AdminMergeUsersProfileInput!
  accountIds: [UserAccountId!]!
  eventIds: [EventId!]!
  wishlistIds: [WishlistId!]!
  transferReservations: Boolean!
}

union AdminGetUserByIdResult =
  | UserFull
  | ValidationRejection
  | UnauthorizedRejection
  | ForbiddenRejection
  | InternalErrorRejection

union AdminGetAllUsersResult =
  | AdminGetAllUsers
  | ValidationRejection
  | UnauthorizedRejection
  | ForbiddenRejection
  | InternalErrorRejection

union AdminUsersStatsResult = AdminUsersStats | UnauthorizedRejection | ForbiddenRejection | InternalErrorRejection

union AdminUpdateUserProfileResult =
  | VoidOutput
  | ValidationRejection
  | UnauthorizedRejection
  | ForbiddenRejection
  | InternalErrorRejection

union AdminDeleteUserResult =
  | VoidOutput
  | ValidationRejection
  | BusinessRuleRejection
  | UnauthorizedRejection
  | ForbiddenRejection
  | InternalErrorRejection

union AdminRemoveUserPictureResult =
  | VoidOutput
  | ValidationRejection
  | UnauthorizedRejection
  | ForbiddenRejection
  | InternalErrorRejection

union AdminRevokeUserSessionResult =
  | VoidOutput
  | ValidationRejection
  | UnauthorizedRejection
  | ForbiddenRejection
  | NotFoundRejection
  | InternalErrorRejection

union AdminRevokeAllUserSessionsResult =
  | VoidOutput
  | ValidationRejection
  | UnauthorizedRejection
  | ForbiddenRejection
  | NotFoundRejection
  | InternalErrorRejection

union AdminSetUserAdminResult =
  | VoidOutput
  | ValidationRejection
  | UnauthorizedRejection
  | ForbiddenRejection
  | NotFoundRejection
  | InternalErrorRejection

union AdminUserMergePreviewResult =
  | AdminUserMergePreview
  | ValidationRejection
  | BusinessRuleRejection
  | UnauthorizedRejection
  | ForbiddenRejection
  | NotFoundRejection
  | InternalErrorRejection

union AdminMergeUsersResult =
  | VoidOutput
  | ValidationRejection
  | BusinessRuleRejection
  | UnauthorizedRejection
  | ForbiddenRejection
  | NotFoundRejection
  | InternalErrorRejection

extend type Query {
  adminUser(userId: UserId!): AdminGetUserByIdResult!
  adminUsers(input: AdminGetAllUsersPaginationFilters): AdminGetAllUsersResult!
  adminUsersStats: AdminUsersStatsResult!
  adminUserMergePreview(sourceUserId: UserId!, targetUserId: UserId!): AdminUserMergePreviewResult!
}

extend type Mutation {
  adminUpdateUserProfile(userId: UserId!, input: AdminUpdateUserProfileInput!): AdminUpdateUserProfileResult!
  adminDeleteUser(userId: UserId!): AdminDeleteUserResult!
  adminRemoveUserPicture(userId: UserId!): AdminRemoveUserPictureResult!
  adminRevokeUserSession(userId: UserId!, sessionId: UserSessionId!): AdminRevokeUserSessionResult!
  adminRevokeAllUserSessions(userId: UserId!): AdminRevokeAllUserSessionsResult!
  adminSetUserAdmin(userId: UserId!, isAdmin: Boolean!): AdminSetUserAdminResult!
  adminMergeUsers(input: AdminMergeUsersInput!): AdminMergeUsersResult!
}
