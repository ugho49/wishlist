enum UserAuthorities {
  ROLE_USER
  ROLE_ADMIN
  ROLE_SUPERADMIN
}

type UserFull {
  id: UserId!
  firstName: String!
  lastName: String!
  email: String!
  pictureUrl: String
  birthday: String
  isEnabled: Boolean!
  createdAt: String!
  updatedAt: String!
  accounts: [UserAccount!]! @resolved
  sessions: [UserSession!]! @resolved
  authorities: [UserAuthorities!]!
}

type AdminGetAllUsers {
  data: [UserFull!]!
  pagination: Pagination!
}

input AdminGetAllUsersPaginationFilters {
  page: Int
  limit: Int
  criteria: String
}

input AdminUpdateUserProfileInput {
  email: String
  newPassword: String
  firstname: String
  lastname: String
  birthday: String
  isEnabled: Boolean
}

union AdminGetUserByIdResult =
  | UserFull
  | ValidationRejection
  | UnauthorizedRejection
  | ForbiddenRejection
  | InternalErrorRejection

union AdminGetAllUsersResult =
  | AdminGetAllUsers
  | ValidationRejection
  | UnauthorizedRejection
  | ForbiddenRejection
  | InternalErrorRejection

union AdminUpdateUserProfileResult =
  | VoidOutput
  | ValidationRejection
  | UnauthorizedRejection
  | ForbiddenRejection
  | InternalErrorRejection

union AdminDeleteUserResult =
  | VoidOutput
  | ValidationRejection
  | UnauthorizedRejection
  | ForbiddenRejection
  | InternalErrorRejection

union AdminRemoveUserPictureResult =
  | VoidOutput
  | ValidationRejection
  | UnauthorizedRejection
  | ForbiddenRejection
  | InternalErrorRejection

union AdminRevokeUserSessionResult =
  | VoidOutput
  | ValidationRejection
  | UnauthorizedRejection
  | ForbiddenRejection
  | NotFoundRejection
  | InternalErrorRejection

union AdminRevokeAllUserSessionsResult =
  | VoidOutput
  | ValidationRejection
  | UnauthorizedRejection
  | ForbiddenRejection
  | NotFoundRejection
  | InternalErrorRejection

extend type Query {
  adminUser(userId: UserId!): AdminGetUserByIdResult!
  adminUsers(input: AdminGetAllUsersPaginationFilters): AdminGetAllUsersResult!
}

extend type Mutation {
  adminUpdateUserProfile(userId: UserId!, input: AdminUpdateUserProfileInput!): AdminUpdateUserProfileResult!
  adminDeleteUser(userId: UserId!): AdminDeleteUserResult!
  adminRemoveUserPicture(userId: UserId!): AdminRemoveUserPictureResult!
  adminRevokeUserSession(userId: UserId!, sessionId: UserSessionId!): AdminRevokeUserSessionResult!
  adminRevokeAllUserSessions(userId: UserId!): AdminRevokeAllUserSessionsResult!
}
