query SecretSantaListPage($filters: PaginationFilters!) {
  mySecretSantas(filters: $filters) {
    __typename
    ... on GetSecretSantasPagedResponse {
      data {
        id
        status
        budget
        description
        users {
          id
        }
        event {
          id
          title
          icon
          eventDate
        }
      }
      pagination {
        totalPages
        totalElements
        pageNumber
        pageSize
      }
    }
  }
}
