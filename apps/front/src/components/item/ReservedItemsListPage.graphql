query ReservedItemsListPage($filters: MyReservedItemsFilters!) {
  myReservedItems(filters: $filters) {
    __typename
    ... on GetReservedItemsPagedResponse {
      data {
        id
        name
        description
        url
        pictureUrl
        takenAt
        purchasedAt
        wishlistId
        wishlistTitle
        ownerFirstName
        ownerLastName
        events {
          id
          title
          eventDate
        }
        takers {
          userId
          firstName
          lastName
          pictureUrl
          takenAt
          purchasedAt
        }
      }
      pagination {
        totalPages
        totalElements
        pageNumber
        pageSize
      }
      purchasedCount
    }
  }
}

mutation SetItemsPurchased($input: SetItemsPurchasedInput!) {
  setItemsPurchased(input: $input) {
    __typename
    ... on SetItemsPurchasedOutput {
      items {
        itemId
        purchasedAt
      }
    }
  }
}
