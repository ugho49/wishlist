query ImportableItems($wishlistId: WishlistId!) {
  importableItems(wishlistId: $wishlistId) {
    __typename
    ... on GetImportableItemsOutput {
      items {
        id
        name
        description
        url
        score
        isSuggested
        pictureUrl
        takers {
          userId
          takenAt
          user {
            id
            firstName
            pictureUrl
          }
        }
        createdAt
      }
    }
  }
}
