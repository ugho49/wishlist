query AdminUsersList($input: AdminGetAllUsersPaginationFilters) {
  adminUsers(input: $input) {
    __typename
    ... on AdminGetAllUsers {
      data {
        id
        firstName
        lastName
        email
        pictureUrl
        isEnabled
        createdAt
        sessions {
          lastUsedAt
        }
      }
      pagination {
        totalPages
        totalElements
        pageNumber
        pageSize
      }
    }
  }
}

query AdminUserDetail($userId: UserId!) {
  adminUser(userId: $userId) {
    __typename
    ... on UserFull {
      id
      firstName
      lastName
      email
      birthday
      signupSource
      signupSourceDetail
      pictureUrl
      isEnabled
      authorities
      createdAt
      accounts {
        id
        provider
        email
        pictureUrl
        createdAt
      }
      sessions {
        id
        ip
        device {
          browser
          browserVersion
          os
          osVersion
          type
          label
        }
        createdAt
        lastUsedAt
        expiresAt
        current
      }
    }
  }
}

mutation AdminUpdateUserProfile($userId: UserId!, $input: AdminUpdateUserProfileInput!) {
  adminUpdateUserProfile(userId: $userId, input: $input) {
    __typename
    ... on VoidOutput {
      success
    }
    ... on ValidationRejection {
      errors {
        field
        message
      }
    }
  }
}

mutation AdminDeleteUser($userId: UserId!) {
  adminDeleteUser(userId: $userId) {
    __typename
    ... on VoidOutput {
      success
    }
  }
}

mutation AdminRemoveUserPicture($userId: UserId!) {
  adminRemoveUserPicture(userId: $userId) {
    __typename
    ... on VoidOutput {
      success
    }
  }
}

mutation AdminRevokeUserSession($userId: UserId!, $sessionId: UserSessionId!) {
  adminRevokeUserSession(userId: $userId, sessionId: $sessionId) {
    __typename
    ... on VoidOutput {
      success
    }
    ... on NotFoundRejection {
      message
    }
  }
}

query AdminUsersStats {
  adminUsersStats {
    __typename
    ... on AdminUsersStats {
      totalCount
      enabledCount
      adminCount
    }
  }
}

mutation AdminRevokeAllUserSessions($userId: UserId!) {
  adminRevokeAllUserSessions(userId: $userId) {
    __typename
    ... on VoidOutput {
      success
    }
  }
}

mutation AdminSetUserAdmin($userId: UserId!, $isAdmin: Boolean!) {
  adminSetUserAdmin(userId: $userId, isAdmin: $isAdmin) {
    __typename
    ... on VoidOutput {
      success
    }
    ... on UnauthorizedRejection {
      message
    }
    ... on ForbiddenRejection {
      message
    }
    ... on NotFoundRejection {
      message
    }
  }
}
