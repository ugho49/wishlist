query EventSelectAvailableEvents($filters: EventPaginationFilters!) {
  events(filters: $filters) {
    __typename
    ... on GetEventsPagedResponse {
      data {
        id
        title
        icon
        eventDate
        attendees {
          role
          user {
            id
          }
        }
        secretSanta {
          id
        }
      }
    }
  }
}
